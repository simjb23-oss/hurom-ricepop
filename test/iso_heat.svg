<text x="30.0" y="22.0" font-size="12" font-weight="800" fill="#15151a">누르는 중(③) · 열 상자 옆 단면 · 왼쪽 = 앞 · 뚜껑 닫힘 · 잠김</text>
<circle cx="171.1" cy="194.4" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="171.1,194.4 486.0,68.0 494.0,68.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="72" font-size="13.5" font-weight="800" fill="#15151a">⑬ 뚜껑 윗보 40 × 22 + 잠금 핀 Ø8 × 2 — 누르는 힘 1.4~4.2kN이 핀 → 기둥 2 → 바닥판으로 닫힘</text>
<text x="500" y="87" font-size="11.5" font-weight="600" fill="#6a6a70">핀 전단 약 42MPa · 윗보 굽힘 약 31MPa · 몸체 · 뚜껑 껍데기엔 힘이 걸리지 않음</text>
<circle cx="217.2" cy="229.0" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="217.2,229.0 486.0,124.0 494.0,124.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="128" font-size="13.5" font-weight="800" fill="#15151a">⑦ 위 열판 — 알루미늄 다이캐스트 · 속에 시즈 히터 450W(빨강) · NTC — 뚜껑 안</text>
<text x="500" y="143" font-size="11.5" font-weight="600" fill="#6a6a70">220°C 유지 · 상한 230°C · 뚜껑 윗보에 볼트로 고정</text>
<circle cx="171.1" cy="248.3" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="171.1,248.3 486.0,180.0 494.0,180.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="184" font-size="13.5" font-weight="800" fill="#15151a">⑦ 플러그 Ø59.6 — 닫으면 틀 안으로 3.5mm · 틈 0.2mm · 입구 모따기 1mm</text>
<text x="500" y="199" font-size="11.5" font-weight="600" fill="#6a6a70">쌀 1.5mm 두께로 눌림 · 물기가 끓어 0.5~1.5MPa(틀 안)</text>
<circle cx="225.0" cy="250.2" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="225.0,250.2 486.0,236.0 494.0,236.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="240" font-size="13.5" font-weight="800" fill="#15151a">⑥ 틀판 — Ø60 × 16 틀 · 턱 + 자리 핀 2로 피스톤과 같은 강철 틀에 정렬</text>
<text x="500" y="255" font-size="11.5" font-weight="600" fill="#6a6a70">마른 쌀 3g 한 겹 · 틀판은 움직이지 않음 · 들어서 씻음</text>
<circle cx="217.2" cy="284.8" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="217.2,284.8 486.0,292.0 494.0,292.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="296" font-size="13.5" font-weight="800" fill="#15151a">⑤ 피스톤 Ø59.6 + 받침 — 속에 시즈 히터 450W(빨강) · 온도 퓨즈 250°C</text>
<text x="500" y="311" font-size="11.5" font-weight="600" fill="#6a6a70">10mm 올라간 상태 · 캠 멈춤(일정 반지름)이라 모터엔 힘이 안 걸림</text>
<rect x="500" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="514" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">① 열 전달 · 8~10초</text><text x="514" y="378" font-size="11.5" fill="#6a6a70">220°C 판 두 장이 위 · 아래에서 바로 데움</text>
<text x="722" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="730" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="744" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">② 압력 ↑</text><text x="744" y="378" font-size="11.5" fill="#6a6a70">틀이 플러그로 막혀 물기가 끓어 0.5~1.5MPa</text>
<text x="952" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="960" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="974" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">③ 9mm 순간 하강</text><text x="974" y="378" font-size="11.5" fill="#6a6a70">캠 절벽 → 압력이 한꺼번에 빠지며 「뻥」 · 두께 약 10.5mm</text>
<rect x="30" y="424" width="560" height="72" rx="12" fill="#fbe9e4"/>
<text x="48" y="452" font-size="13.5" font-weight="800" fill="#c8503c">김 길 — 틀 → 틀판 위 → 뒤 벽 위 구멍 Ø8 × 2 → 덕트 → 뒤 김 슬릿 (+ 뚜껑 열 때 조금)</text>
<text x="48" y="474" font-size="11.5" fill="#6a6a70">순간 하강 때와 뚜껑이 10mm 들릴 때 김이 나옴(한 장 0.45g) · 사람이 젖히기 전 3초 · 덕트 아래 물받이 홈</text>
<rect x="610" y="424" width="560" height="72" rx="12" fill="#f3efe6"/>
<text x="628" y="452" font-size="13.5" font-weight="800" fill="#15151a">전기 — 220V 직결 · 약 1kW = 시즈 히터 450W × 2 + 모터 · 제어</text>
<text x="628" y="474" font-size="11.5" fill="#6a6a70">켜고 약 3분 데우면 「예열 완료」 불빛 · 뚜껑 열리면 히터 꺼짐 · NTC 2 + 온도 퓨즈 250°C 2중 차단</text>
</svg>
</g>
<text x="30.0" y="22.0" font-size="12" font-weight="800" fill="#15151a">누르는 중(③) · 열 상자 옆 단면 · 왼쪽 = 앞</text>
<circle cx="183.0" cy="96.8" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="183.0,96.8 486.0,68.0 494.0,68.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="72" font-size="13.5" font-weight="800" fill="#15151a">⑬ 윗보 40 × 22 세움 — 위 열판을 받침 · 누르는 힘 1.4~4.2kN이 기둥 2로 내려가 바닥판에서 닫힘</text>
<text x="500" y="87" font-size="11.5" font-weight="600" fill="#6a6a70">굽힘 약 31MPa · 처짐 0.01mm · 몸체 · 열 상자 벽엔 힘이 걸리지 않음</text>
<circle cx="244.2" cy="142.6" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="244.2,142.6 486.0,124.0 494.0,124.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="128" font-size="13.5" font-weight="800" fill="#15151a">⑦ 위 열판 — 알루미늄 다이캐스트 · 속에 시즈 히터 450W(빨강) · NTC</text>
<text x="500" y="143" font-size="11.5" font-weight="600" fill="#6a6a70">220°C 유지 · 상한 230°C · 틀 윗보에 볼트로 고정</text>
<circle cx="183.0" cy="180.9" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="183.0,180.9 486.0,180.0 494.0,180.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="184" font-size="13.5" font-weight="800" fill="#15151a">⑦ 플러그 Ø59 — 틀 안으로 13.5mm 들어가 밀봉(틈 0.1~0.2mm)</text>
<text x="500" y="199" font-size="11.5" font-weight="600" fill="#6a6a70">쌀 1.5mm 두께로 눌림 · 물기가 끓어 0.5~1.5MPa(틀 안)</text>
<circle cx="254.4" cy="198.8" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="254.4,198.8 486.0,236.0 494.0,236.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="240" font-size="13.5" font-weight="800" fill="#15151a">⑥ 몰드 트레이 — Ø6 틀 15mm · 바닥은 밀판 Ø58 · 피스톤이 트레이째 밀어 올림</text>
<text x="500" y="255" font-size="11.5" font-weight="600" fill="#6a6a70">마른 쌀 3g 한 겹 · 서랍 프레임에서 18mm 떠 있음</text>
<circle cx="244.2" cy="242.1" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="244.2,242.1 486.0,292.0 494.0,292.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="296" font-size="13.5" font-weight="800" fill="#15151a">⑤ 피스톤 Ø70 + 받침 — 속에 시즈 히터 450W(빨강) · 온도 퓨즈 250°C</text>
<text x="500" y="311" font-size="11.5" font-weight="600" fill="#6a6a70">20mm 올라간 상태 · 토글 사점 잠금</text>
<rect x="500" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="514" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">① 열 전달 · 8~10초</text><text x="514" y="378" font-size="11.5" fill="#6a6a70">220°C 판 두 장이 위 · 아래에서 바로 데움</text>
<text x="722" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="730" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="744" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">② 압력 ↑</text><text x="744" y="378" font-size="11.5" fill="#6a6a70">틀이 플러그로 막혀 물기가 끓어 0.5~1.5MPa</text>
<text x="952" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="960" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="974" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">③ 8~10mm 순간 하강</text><text x="974" y="378" font-size="11.5" fill="#6a6a70">압력이 한꺼번에 빠지며 「뻥」 · 두께 9~11mm</text>
<rect x="30" y="424" width="560" height="72" rx="12" fill="#fbe9e4"/>
<text x="48" y="452" font-size="13.5" font-weight="800" fill="#c8503c">김 길 — 틀 → 열 상자 안 → 뒤 벽 위 구멍 Ø8 × 2 → 덕트 → 뒤 김 슬릿</text>
<text x="48" y="474" font-size="11.5" fill="#6a6a70">순간 하강과 플러그가 빠질 때 김이 나옴(한 장 0.45g) · 앞(서랍 · 사람 쪽)으로는 길이 없음 · 덕트 아래 물받이 홈</text>
<rect x="610" y="424" width="560" height="72" rx="12" fill="#f3efe6"/>
<text x="628" y="452" font-size="13.5" font-weight="800" fill="#15151a">전기 — 220V 직결 · 약 1kW = 시즈 히터 450W × 2 + 모터 · 제어</text>
<text x="628" y="474" font-size="11.5" fill="#6a6a70">켜고 약 3분 데우면 「예열 완료」 불빛 · 온도 제어 NTC 2 + 온도 퓨즈 250°C 2중 차단</text>
</svg>
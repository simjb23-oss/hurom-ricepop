</g>
<text x="30" y="22" font-size="12" font-weight="800" fill="#15151a">누르는 중(③) · 옆 단면(뒤 칸 + 앞 칸, 3칸 중 2칸이 보임) · 왼쪽 = 앞 · 뚜껑 닫힘 · 잠김</text>
<circle cx="261.7" cy="145.1" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="261.7,145.1 486.0,56.0 494.0,56.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="60" font-size="13.5" font-weight="800" fill="#15151a">⑬ 뚜껑 보 11t — 뒤 경첩 축 + 앞 갈고리 2 · 잠금 막대</text>
<text x="500" y="75" font-size="11.5" font-weight="600" fill="#6a6a70">힘 2.9~8.8kN이 보 → 경첩 · 갈고리 → C자 틀 → 바닥판으로 닫힘 · 껍데기엔 힘 없음</text>
<circle cx="210.2" cy="174.5" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="210.2,174.5 486.0,108.0 494.0,108.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="112" font-size="13.5" font-weight="800" fill="#15151a">⑦ 위 열판 — 뚜껑 안 고정 · 속 시즈 히터 450W(빨강) · NTC</text>
<text x="500" y="127" font-size="11.5" font-weight="600" fill="#6a6a70">220°C 유지 · 상한 230°C · 전선은 여기까지</text>
<circle cx="96.3" cy="189.2" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="96.3,189.2 486.0,160.0 494.0,160.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="164" font-size="13.5" font-weight="800" fill="#15151a">⑫ 위 판 — 얕은 볼록 3(높이 6) · 전선 없음 · 떼어 씻음</text>
<text x="500" y="179" font-size="11.5" font-weight="600" fill="#6a6a70">볼록 끝과 칸 바닥 사이 2mm = 눌린 쌀 · 칸 테두리가 판 면에 닿아 막힘</text>
<circle cx="68.7" cy="218.6" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="68.7,218.6 486.0,212.0 494.0,212.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="216" font-size="13.5" font-weight="800" fill="#15151a">⑥ 아래 판 — 얕은 칸 Ø50 × 8 셋 · 받침에 얹힘</text>
<text x="500" y="231" font-size="11.5" font-weight="600" fill="#6a6a70">10mm 올라간 상태 · 칸 안 물기가 끓어 0.5~1.5MPa</text>
<circle cx="217.6" cy="249.9" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="217.6,249.9 486.0,264.0 494.0,264.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="268" font-size="13.5" font-weight="800" fill="#15151a">⑤ 받침 — 속 시즈 히터 450W(빨강) · 온도 퓨즈 250°C</text>
<text x="500" y="283" font-size="11.5" font-weight="600" fill="#6a6a70">캠이 일정 반지름에서 멈춰 있어 모터엔 힘이 안 걸림</text>
<rect x="500" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="514" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">① 열 전달 · 8~10초</text><text x="514" y="378" font-size="11.5" fill="#6a6a70">220°C 판 두 장이 쌀을 바로 데움</text>
<text x="722" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="730" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="744" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">② 압력 ↑</text><text x="744" y="378" font-size="11.5" fill="#6a6a70">막힌 칸 안 물기가 끓어 0.5~1.5MPa</text>
<text x="952" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="960" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="974" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">③ 9mm 순간 하강</text><text x="974" y="378" font-size="11.5" fill="#6a6a70">캠 절벽 → 세 칸 「뻥」 · 약 10mm</text>
<rect x="30" y="424" width="560" height="72" rx="12" fill="#fbe9e4"/>
<text x="48" y="452" font-size="13.5" font-weight="800" fill="#c8503c">김 길 — 칸 → 두 판 사이 틈 → 뒤 벽 위 구멍 Ø8 × 2 → 덕트 → 뒤 김 슬릿</text>
<text x="48" y="474" font-size="11.5" fill="#6a6a70">순간 하강 때 칸이 열리며 김이 나옴(3장 약 1.35g) · 뚜껑이 2cm 들릴 때 남은 김도 뒤로 · 덕트 아래 물받이 홈</text>
<rect x="610" y="424" width="560" height="72" rx="12" fill="#f3efe6"/>
<text x="628" y="452" font-size="13.5" font-weight="800" fill="#15151a">전기 — 220V 직결 · 약 1kW = 시즈 히터 450W × 2 + 모터 · 제어</text>
<text x="628" y="474" font-size="11.5" fill="#6a6a70">예열 약 4분 → 「예열 완료」 불빛 · 판이 없거나 뚜껑이 열리면 히터 꺼짐 · NTC 2 + 온도 퓨즈 2중 차단</text>
</svg>
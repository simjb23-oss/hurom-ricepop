<text x="285.0" y="396.8" font-size="11.5" fill="#6a6a70">④ 토글 사점 잠금 — 내압 0.5~1.5MPa를 버팀</text>
<text x="87.8" y="97.6" font-size="10" fill="#6a6a70" text-anchor="middle">앞문</text>
<text x="91.2" y="29.6" font-size="12" font-weight="800" fill="#15151a">누르는 중(②) · 열 상자 옆 단면 · 왼쪽 = 앞</text>
<circle cx="329.2" cy="131.6" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="329.2,131.6 486.0,68.0 494.0,68.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="72" font-size="13.5" font-weight="800" fill="#15151a">⑦ 위 열판 — 알루미늄 다이캐스트 · 속에 시즈 히터 450W(빨강)</text>
<text x="500" y="87" font-size="11.5" font-weight="600" fill="#6a6a70">NTC 센서가 220°C 유지 · 상한 230°C(넘으면 끊음) · 고정</text>
<circle cx="290.1" cy="157.1" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="290.1,157.1 486.0,124.0 494.0,124.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="128" font-size="13.5" font-weight="800" fill="#15151a">⑥ 몰드 링 Ø6 — 피스톤이 6mm 들어가 밀봉</text>
<text x="500" y="143" font-size="11.5" font-weight="600" fill="#6a6a70">링 안이 막혀 압력이 오름(회색 화살) · 위 열판 아래 고정</text>
<circle cx="244.2" cy="152.0" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="244.2,152.0 486.0,180.0 494.0,180.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="184" font-size="13.5" font-weight="800" fill="#15151a">불린 쌀 3g — 판이 바로 닿아 데움(빨간 화살)</text>
<text x="500" y="199" font-size="11.5" font-weight="600" fill="#6a6a70">증기 · 뜨거운 바람 없음 · 수분 20% 안팎이 끓으며 압력 ↑</text>
<circle cx="285.0" cy="170.7" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="285.0,170.7 486.0,236.0 494.0,236.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="240" font-size="13.5" font-weight="800" fill="#15151a">⑤ 피스톤 Ø6 + 받침 — 속에 시즈 히터 450W(빨강) · 온도 퓨즈 250°C</text>
<text x="500" y="255" font-size="11.5" font-weight="600" fill="#6a6a70">이것만 25mm 오르내림 · 받침 앞 배출 턱(피스톤 면 높이)</text>
<circle cx="387.0" cy="197.9" r="3.4" fill="#d19a3c" stroke="#fff" stroke-width="1.2"/><polyline points="387.0,197.9 486.0,292.0 494.0,292.0" fill="none" stroke="#9a948a" stroke-width="1"/>
<text x="500" y="296" font-size="13.5" font-weight="800" fill="#15151a">⑫ 계량 슬라이드 틈 — 피스톤이 내려간 뒤에만 들어옴</text>
<text x="500" y="311" font-size="11.5" font-weight="600" fill="#6a6a70">쌀 넣기 + 밀어내기 겸용 · 가열 중엔 뒤 벽 안에 물러나 있음</text>
<rect x="500" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="514" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">① 열 전달 · 8~10초</text><text x="514" y="378" font-size="11.5" fill="#6a6a70">220°C 판 두 장이 위 · 아래에서 바로 데움</text>
<text x="722" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="730" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="744" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">② 압력 ↑</text><text x="744" y="378" font-size="11.5" fill="#6a6a70">링 안이 막혀 물기가 끓어 0.5~1.5MPa</text>
<text x="952" y="368" font-size="22" fill="#d19a3c" text-anchor="middle">›</text>
<rect x="960" y="330" width="214" height="64" rx="12" fill="#fff" stroke="#e6e1d7"/>
<text x="974" y="356" font-size="13.5" font-weight="800" fill="#8a5d12">③ 2~3mm 순간 하강</text><text x="974" y="378" font-size="11.5" fill="#6a6a70">압력이 한꺼번에 빠지며 「뻥」 · 부피 5~8배</text>
<rect x="30" y="424" width="560" height="72" rx="12" fill="#fbe9e4"/>
<text x="48" y="452" font-size="13.5" font-weight="800" fill="#c8503c">칩 모드 — 같은 열판 170~180°C · 60~80초 · 순간 하강 없음</text>
<text x="48" y="474" font-size="11.5" fill="#6a6a70">반죽은 칩 카세트 → 슬라이드 컵 8g → 몰드 링 가운데(쌀과 같은 길) · 얇게 눌러 굽기 · 전병 원리 · 같은 슬롯으로 배출</text>
<rect x="610" y="424" width="560" height="72" rx="12" fill="#f3efe6"/>
<text x="628" y="452" font-size="13.5" font-weight="800" fill="#15151a">전기 — 220V 직결 · 약 1kW = 시즈 히터 450W × 2 + 모터 · 제어</text>
<text x="628" y="474" font-size="11.5" fill="#6a6a70">켜고 약 3분 데우면 「예열 완료」 불빛 · 온도 제어 NTC 2 + 온도 퓨즈 250°C 2중 차단</text>
</svg>